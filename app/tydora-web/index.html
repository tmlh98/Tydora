<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <!-- 提前设置主题，避免页面闪烁 -->
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('zmd-theme');
          var builtins = ['white','mint','mint-dark','liquid-glass','claude-code','purple','hermes','next'];
          if (theme && builtins.indexOf(theme) !== -1) {
            document.documentElement.dataset.theme = theme;
          }
        } catch(e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <title>zmd - Markdown Editor</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__ZMD_ERRORS__ = [];
      // 同一错误（如 mousemove 中反复抛出）只占一行并计数，避免刷屏
      var zmdErrorRows = {};
      window.onerror = function(msg, src, line, col, err) {
        var info = String(msg) + ' @ ' + String(src) + ':' + line;
        window.__ZMD_ERRORS__.push(info);
        var el = document.getElementById('zmd-error');
        var list = document.getElementById('zmd-error-list');
        if (el && list) {
          var row = zmdErrorRows[info];
          if (row) {
            row.count++;
            row.badge.textContent = ' ×' + row.count;
          } else {
            var div = document.createElement('div');
            div.textContent = info;
            var badge = document.createElement('span');
            badge.style.opacity = '0.8';
            div.appendChild(badge);
            list.appendChild(div);
            zmdErrorRows[info] = { count: 1, badge: badge };
          }
          el.style.display = 'block';
        }
        console.error('[zmd]', msg, err);
      };
      function zmdCloseErrors() {
        var el = document.getElementById('zmd-error');
        var list = document.getElementById('zmd-error-list');
        if (list) list.textContent = '';
        zmdErrorRows = {};
        if (el) el.style.display = 'none';
      }
    </script>
    <div id="zmd-error" style="display:none;position:fixed;top:0;left:0;right:0;background:#e06c75;color:#fff;padding:12px 36px 12px 12px;z-index:99999;font-family:monospace;font-size:12px;max-height:200px;overflow:auto;white-space:pre-wrap;">
      <button type="button" onclick="zmdCloseErrors()" title="Close" aria-label="Close" style="position:absolute;top:6px;right:8px;background:transparent;border:none;color:#fff;font-size:18px;line-height:1;cursor:pointer;padding:2px 6px;">×</button>
      <div id="zmd-error-list"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
